<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <link rel="stylesheet" href="the_gui_stylesheet.css">

    </head>
    <body>
        <h1>This is a prototype</h1>
        <br>
        <div class="flex-container">
            <div style="width: 25%; background-color: #f0f0f0;">
                <h1>Adding files:</h1>
                <p>this is column one</p>


                <br>

                <input type="file" id="oneFile" accept=".pdf, .txt" required>
                <button class="interactable" onclick="createFile()">Create File</button>

                <br>
                <br>

                <input type="file" id="filesInBulk" accept=".pdf, .txt" multiple>
                <button class="interactable" onclick="createFiles()">Create Files</button>
                <script src="java_script_gui.js"></script>

                <br>
                <br>



                <button class="interactable" onclick="deleteLast()">Remove Last File</button>

            </div>
            <div style="width: 75%; background-color: #f0f0f0;">

                <h1>Files:</h1>
                <label for="gsearch">search</label>
                <p id="testPrintNumOne"></p>
                <p id="testPrintNumTwo"></p>
                <!--Dark grey border for files: #94999e, border when hover: #55595e, the background: #e9e9e9-->
                <input type="search" id="gsearch" name="gsearch" style="border-radius: 7px;">

                <div id="result" class="flex-container" style="flex-wrap: wrap;"></div>

                <!--<img id="preview" src="" alt = "image goes here">-->

            </div>
        </div>
    </body>
</html>
